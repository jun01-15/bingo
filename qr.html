<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビンゴQRコード</title>
<style>
  @page { size: A4 portrait; margin: 15mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: #111; text-align: center;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
  }
  .setup { max-width: 640px; margin: 16px auto; padding: 0 16px; text-align: left; font-size: 14px; }
  .setup input { width: 100%; font-size: 15px; padding: 8px; margin: 4px 0 8px; }
  .setup button { font-size: 15px; padding: 8px 14px; }
  .poster { padding: 24px 16px; }
  h1 { font-size: 34px; margin: 10px 0 6px; }
  .lead { font-size: 18px; margin: 0 0 18px; }
  #qr { display: inline-block; }
  #qr svg { width: min(80vw, 120mm); height: auto; }
  .url { font-size: 13px; color: #444; word-break: break-all; margin-top: 10px; }
  ol { display: inline-block; text-align: left; font-size: 17px; line-height: 1.9; margin-top: 16px; }
  @media print { .setup { display: none; } }
</style>
</head>
<body>

<div class="setup">
  <b>会場掲示用 QRコード</b>（この枠は印刷されません）<br>
  ビンゴページの公開URLを入れて「作成」→ 印刷してください。
  <input id="url">
  <button id="make">作成</button>
  <button onclick="window.print()">印刷</button>
</div>

<div class="poster">
  <h1>25マス交流チャレンジ</h1>
  <p class="lead">スマホのカメラで読み込んでビンゴを開こう！</p>
  <div id="qr"></div>
  <div class="url" id="urlText"></div>
  <ol>
    <li>QRコードを読み込み、自分の名前を入力</li>
    <li>条件に当てはまる人を探して話しかける</li>
    <li>マスをタップして、<b>相手に名前を入力</b>してもらう</li>
    <li>終了の合図で「提出する」→ スタッフに画面を見せる</li>
  </ol>
</div>

<!-- qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) -->
<script src="qrcode.js"></script>
<script>
  const input = document.getElementById("url");
  // 既定値：このページと同じ場所にある index.html
  input.value = new URL("./", location.href).href;
  function make() {
    const url = input.value.trim();
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    document.getElementById("urlText").textContent = url;
  }
  document.getElementById("make").addEventListener("click", make);
  make();
</script>
</body>
</html>
